<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨越时空的回信 · 对话毛泽东</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #5a1a1a; /* 深红色背景 */
            background-image: radial-gradient(circle at 10% 20%, #7a2a2a, #3a0a0a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #fdf6ee; /* 仿古宣纸色 */
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #d4a847; /* 金色边框 */
        }

        /* 头部：标题区 */
        .header {
            background: linear-gradient(135deg, #a02020, #6a1010);
            padding: 18px 28px;
            border-bottom: 3px solid #d4a847;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .header-icon {
            font-size: 32px;
            line-height: 1;
        }

        .header-title {
            color: #fad98b;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header-sub {
            color: #ecca7a;
            font-size: 14px;
            margin-left: auto;
            opacity: 0.9;
            border-left: 1px solid #d4a847;
            padding-left: 16px;
        }

        /* 中间：聊天消息区域 */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: rgba(253, 246, 238, 0.6);
            scroll-behavior: smooth;
        }

        /* 消息气泡样式 */
        .message {
            max-width: 80%;
            padding: 14px 20px;
            border-radius: 16px;
            line-height: 1.7;
            font-size: 16px;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 用户消息：右对齐（蓝色调） */
        .message.user {
            align-self: flex-end;
            background: #d9e8f5;
            color: #1a2a3a;
            border-bottom-right-radius: 4px;
            border: 1px solid #b8cce0;
        }

        /* AI消息：左对齐（红色调，仿伟人语气） */
        .message.ai {
            align-self: flex-start;
            background: #fff8ef;
            color: #3d1f1f;
            border-bottom-left-radius: 4px;
            border-left: 4px solid #a02020;
            box-shadow: 0 2px 12px rgba(160, 32, 32, 0.08);
        }

        .message.ai .role-tag {
            font-size: 13px;
            font-weight: bold;
            color: #a02020;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message .timestamp {
            font-size: 11px;
            color: #999;
            margin-top: 6px;
            text-align: right;
        }

        /* 底部：输入区 */
        .input-area {
            background: #ffffff;
            padding: 16px 24px 20px 24px;
            border-top: 2px solid #d4a847;
            display: flex;
            gap: 14px;
            align-items: flex-end;
            flex-shrink: 0;
            background: #fcf6ed;
        }

        .input-area textarea {
            flex: 1;
            border: 2px solid #d0c0b0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            height: 52px;
            max-height: 120px;
            background: white;
            transition: border-color 0.2s;
            outline: none;
            line-height: 1.5;
        }

        .input-area textarea:focus {
            border-color: #a02020;
            box-shadow: 0 0 0 3px rgba(160, 32, 32, 0.1);
        }

        .input-area button {
            background: #a02020;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 28px;
            height: 52px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(160, 32, 32, 0.3);
            letter-spacing: 2px;
        }

        .input-area button:hover {
            background: #7a1818;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(160, 32, 32, 0.4);
        }

        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 加载中的闪烁点点 */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 8px 4px;
        }
        .typing-indicator span {
            width: 10px;
            height: 10px;
            background: #a02020;
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* 滚动条美化 */
        .messages::-webkit-scrollbar {
            width: 6px;
        }
        .messages::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        .messages::-webkit-scrollbar-thumb {
            background: #b09080;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .header-title { font-size: 18px; letter-spacing: 2px; }
            .header-sub { display: none; }
            .message { max-width: 90%; }
            .input-area button { padding: 0 16px; font-size: 15px; }
        }

        /* 服务器状态横幅 */
#server-status {
    background-color: #d32f2f;
    color: white;
    text-align: center;
    padding: 8px 0;
    font-size: 14px;
    display: none;
    position: sticky;
    top: 0;
    z-index: 100;
}
#server-status a {
    color: #ffd54f;
    text-decoration: underline;
    cursor: pointer;
}

.message-text {
    white-space: pre-wrap;   /* 保留换行符和空格，自动换行 */
    word-break: break-word;  /* 长词自动换行，避免溢出 */
}
    </style>
</head>
<body>
<div id="server-status">
    ⚠️ 后端服务未连接，请确保服务器已启动。 <a id="retry-btn">点击重试</a>
</div>
<div class="chat-container">
    <!-- 头部 -->
    <div class="header">
        <span class="header-icon">📜</span>
        <span class="header-title">跨越时空的回信</span>
        <span class="header-sub">与毛泽东同志对话</span>
        <button id="muteBtn" style="
            background: rgba(255,255,255,0.15);
            border: 1px solid #d4a847;
            color: #fad98b;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
            margin-left: auto;
            transition: all 0.2s;
            flex-shrink: 0;
">🔊</button>
    </div>

    <!-- 消息列表 -->
<div id="messageBox" class="messages">
    <div class="message ai">
        <div class="role-tag">
            <img src="https://ts1.tc.mm.bing.net/th/id/R-C.9f1516874216ed04ec740b10379fc960?rik=ff98IfhVpO2dVg&riu=http%3a%2f%2fart.people.com.cn%2fNMediaFile%2f2013%2f1226%2fMAIN201312260921000445108988591.jpg&ehk=TB4IlBNGnX7Qv7MUfo091W4UlidUGzkSu3idbUdhqrY%3d&risl=&pid=ImgRaw&r=0" 
                 alt="毛泽东" 
                 style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 8px; border: 2px solid #d4a847;"
                 onerror="this.style.display='none'; this.parentNode.innerHTML='🧓 毛泽东'">
            毛泽东
        </div>
        同志你好！我是毛泽东。有什么关于革命岁月、红色历史的问题，你尽管问吧。
        <div class="timestamp">此刻</div>
    </div>
</div>

    <!-- 底部输入 -->
    <div class="input-area">
        <textarea id="userInput" rows="1" placeholder="输入你的问题..." ></textarea>
        <button id="sendBtn">发送</button>
    </div>
</div>

<script>

// ========== 后端服务器检测 ==========
async function checkServerStatus() {
    try {
        // 如果你的前端是通过 http://localhost:5000 访问的，用相对路径 '/ping'
        // 如果还是 file:// 打开，请改为 'http://localhost:5000/ping'
        const response = await fetch('/ping', {
            method: 'GET',
            // 设置超时（部分浏览器不支持 timeout 参数，可用 AbortController 实现，但为了简化，这里用 Promise.race）
            signal: AbortSignal.timeout(3000)
        });
        if (response.ok) {
            document.getElementById('server-status').style.display = 'none';
            return true;
        } else {
            throw new Error('Server error');
        }
    } catch (error) {
        document.getElementById('server-status').style.display = 'block';
        return false;
    }
}

// 页面加载后执行检测
document.addEventListener('DOMContentLoaded', function() {
    checkServerStatus();
    // 重试按钮
    document.getElementById('retry-btn').addEventListener('click', function() {
        checkServerStatus();
    });
    // 可选：每30秒自动检测一次
    // setInterval(checkServerStatus, 30000);
});

// ========== 静音控制 ==========
let isMuted = false;
const muteBtn = document.getElementById('muteBtn');

muteBtn.addEventListener('click', function() {
    isMuted = !isMuted;
    this.textContent = isMuted ? '🔇' : '🔊';
    // 如果静音，立即暂停当前播放
    if (isMuted) {
        const audio = document.getElementById('audioPlayer');
        audio.pause();
        audio.currentTime = 0;
    }
    console.log('🔇 静音状态:', isMuted ? '已静音' : '已取消静音');
});

    let conversationHistory = [];  // 新增：存储对话历史
    const messageBox = document.getElementById('messageBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    
    // 自动调整输入框高度
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // 按 Enter 发送（Shift+Enter 换行）
    userInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    function addMessage(text, type, timestamp = null) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        
        if (type === 'ai') {
            div.innerHTML = `
    <div class="role-tag">
        <img src="https://ts1.tc.mm.bing.net/th/id/R-C.9f1516874216ed04ec740b10379fc960?rik=ff98IfhVpO2dVg&riu=http%3a%2f%2fart.people.com.cn%2fNMediaFile%2f2013%2f1226%2fMAIN201312260921000445108988591.jpg&ehk=TB4IlBNGnX7Qv7MUfo091W4UlidUGzkSu3idbUdhqrY%3d&risl=&pid=ImgRaw&r=0" 
         alt="毛泽东" 
         style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 8px; border: 2px solid #d4a847;"
         onerror="this.style.display='none'; this.parentNode.innerHTML='🧓 毛泽东'">
        毛泽东
    </div>
    <div class="message-text">${text}</div>
`;
        } else {
            div.textContent = text;
        }
        
        if (timestamp) {
            const timeSpan = document.createElement('div');
            timeSpan.className = 'timestamp';
            timeSpan.textContent = timestamp;
            div.appendChild(timeSpan);
        }
        
        messageBox.appendChild(div);
        messageBox.scrollTop = messageBox.scrollHeight;
    }

function addTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typingIndicator';
    div.innerHTML = `
        <div class="role-tag">
            <img src="https://ts1.tc.mm.bing.net/th/id/R-C.9f1516874216ed04ec740b10379fc960?rik=ff98IfhVpO2dVg&riu=http%3a%2f%2fart.people.com.cn%2fNMediaFile%2f2013%2f1226%2fMAIN201312260921000445108988591.jpg&ehk=TB4IlBNGnX7Qv7MUfo091W4UlidUGzkSu3idbUdhqrY%3d&risl=&pid=ImgRaw&r=0" 
                 alt="毛泽东" 
                 style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 8px; border: 2px solid #d4a847;"
                 onerror="this.style.display='none'; this.parentNode.innerHTML='🧓 毛泽东'">
            毛泽东
        </div>
        <div class="typing-indicator">
            <span></span><span></span><span></span>
        </div>
    `;
    messageBox.appendChild(div);
    messageBox.scrollTop = messageBox.scrollHeight;
}

    function removeTypingIndicator() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

function enableAudioPlayback() {
    // 使用 Web Audio API 激活音频上下文，不影响当前音频元素
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') {
            ctx.resume().then(() => {
                console.log('✅ 音频上下文已激活');
            }).catch(e => console.warn('⚠️ 音频上下文恢复失败:', e));
        } else if (ctx.state === 'running') {
            console.log('✅ 音频上下文已在运行');
        }
    } catch (e) {
        console.warn('⚠️ 音频授权失败（可忽略）:', e);
    }
}


    async function sendMessage() {

    // --- 立即重置音频元素，清除旧 src，防止误播 ---
    const audio = document.getElementById('audioPlayer');
    audio.pause();
    audio.currentTime = 0;
    audio.src = '';
    audio.load();
    audio.oncanplaythrough = null;  // 移除旧事件绑定
    
    // 1. 在用户点击时立即授权自动播放
    enableAudioPlayback();
    const text = userInput.value.trim();
    if (!text) return;

    // 禁用UI
    userInput.disabled = true;
    sendBtn.disabled = true;
    
    // 1. 把用户消息存入历史
    const userMsg = { role: 'user', content: text };
    conversationHistory.push(userMsg);

    // 添加用户消息到界面
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    addMessage(text, 'user', timeStr);
    userInput.value = '';
    userInput.style.height = 'auto';

    addTypingIndicator();

    try {
        // 2. 发送请求时，把历史记录也带上
        const response = await fetch('http://localhost:5000/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                message: text, 
                history: conversationHistory   // 关键：传历史数组
            })
        });

        const data = await response.json();
        removeTypingIndicator();

        if (response.ok) {
            const replyTime = new Date();
            const replyStr = replyTime.getHours().toString().padStart(2,'0') + ':' + replyTime.getMinutes().toString().padStart(2,'0');
            addMessage(data.response, 'ai', replyStr);
            
            // 3. 把AI回答也存入历史
            const aiMsg = { role: 'assistant', content: data.response };
            conversationHistory.push(aiMsg);

            // 调用语音合成
            speakText(data.response);
        } else {
            addMessage('⚠️ 出错了：' + (data.error || '未知错误'), 'ai');
        }
    } catch (error) {
        removeTypingIndicator();
        addMessage('⚠️ 无法连接到服务器，请确认后端是否已启动（python app.py）', 'ai');
        console.error('Fetch error:', error);
    }

    userInput.disabled = false;
    sendBtn.disabled = false;
    userInput.focus();
}

// ========== 新增：语音合成与播放函数 ==========
async function speakText(text) {
    try {
        const audioPlayer = document.getElementById('audioPlayer');
        
        // 1. 停止当前播放并重置
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.src = '';           // 清空 src，释放资源
        audioPlayer.load();             // 重置加载状态

        // 2. 移除旧的事件监听（避免旧回调被触发）
        audioPlayer.oncanplaythrough = null;
        audioPlayer.onerror = null;

        // 3. 请求新音频
        const response = await fetch('http://localhost:5000/synthesize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        });

        const data = await response.json();
        if (response.ok && data.audio_url) {
            // 4. 设置新 src（使用完整 URL）
            const fullAudioUrl = `http://localhost:5000${data.audio_url}`;
            audioPlayer.src = fullAudioUrl;
            audioPlayer.load();

            // 5. 绑定新的播放事件
            audioPlayer.oncanplaythrough = function() {
                if (!isMuted) {  // 只有非静音状态才播放
                audioPlayer.play().catch(e => {
                    console.warn('⚠️ 自动播放失败:', e);
                    // 降级：如果自动播放被拦截，可在此显示一个“点击播放”按钮
                });
            } else {console.log('🔇 当前为静音状态，跳过播放');}

        };

            // 如果音频已经加载完成（readyState >= 4），直接触发
            if (audioPlayer.readyState >= 4) {
                audioPlayer.oncanplaythrough();
            }
        } else {
            console.warn('语音合成失败:', data.error);
        }
    } catch (error) {
        console.error('请求语音合成失败:', error);
    }
}
</script>
<!-- 隐藏的音频播放器，用于播放语音 -->
<audio id="audioPlayer" style="display: none;"></audio>
</body>
</html>
